name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.x"
          cache: true
      - run: sudo apt-get update && sudo apt-get install --yes clang llvm
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go generate ./internal/probe
      - name: Verify generated bindings and same-toolchain object reproducibility
        run: |
          git diff --exit-code -- internal/probe/*.go
          sha256sum internal/probe/*.o > /tmp/bpf-objects.sha256
          go generate ./internal/probe
          sha256sum --check /tmp/bpf-objects.sha256
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./cmd/sentinel ./cmd/benchmark
      - run: go run ./cmd/benchmark -out /tmp/kernel-sentinel-benchmark
      - run: sh -n lab/run.sh && cc -Wall -Wextra -Werror -fsyntax-only lab/parent.c lab/setuid-helper.c
      - run: docker compose config --quiet && docker compose -f docker-compose.live.yml config --quiet && docker compose -f lab/docker-compose.yml config --quiet
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: kernel-sentinel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
