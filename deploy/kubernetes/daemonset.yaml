apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kernel-sentinel
  labels:
    app.kubernetes.io/name: kernel-sentinel
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kernel-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kernel-sentinel
    spec:
      automountServiceAccountToken: false
      hostPID: true
      terminationGracePeriodSeconds: 10
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        # Runtime visibility is also useful on tainted control-plane and dedicated nodes.
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: sentinel
          image: kernel-sentinel
          args:
            - -source
            - live
            - -rules
            - /etc/kernel-sentinel/rules
            - -listen
            - 0.0.0.0:8081
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: SENTINEL_PROC_ROOT
              value: /host/proc
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [BPF, PERFMON, SYS_RESOURCE]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/kernel-sentinel
                - -healthcheck
                - http://127.0.0.1:8081/healthz
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/kernel-sentinel
                - -healthcheck
                - http://127.0.0.1:8081/healthz
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
