apiVersion: v1
kind: Service
metadata:
  name: kernel-sentinel
  labels:
    app.kubernetes.io/name: kernel-sentinel
spec:
  # ClusterIP plus the companion NetworkPolicy keeps the dashboard/API private.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kernel-sentinel
  ports:
    - name: http
      port: 8081
      targetPort: http
      appProtocol: http
